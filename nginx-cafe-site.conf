# Nginx configuration for Cafe Site v2
# 실서버에서 사용: sudo cp nginx-cafe-site.conf /etc/nginx/sites-available/cafe-site
#               sudo ln -s /etc/nginx/sites-available/cafe-site /etc/nginx/sites-enabled/
#               sudo systemctl reload nginx

upstream cafe_backend {
    server 127.0.0.1:8000;
}

upstream cafe_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name cafe.100.80.214.126 _;

    # 프론트엔드 정적 콘텐츠 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://cafe_frontend;
        proxy_cache_valid 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 백엔드 API 라우팅
    location /api/ {
        proxy_pass http://cafe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 FastAPI Swagger 문서
    location /docs {
        proxy_pass http://cafe_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://cafe_backend;
    }

    # WebSocket 지원
    location /ws/ {
        proxy_pass http://cafe_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 프론트엔드 라우팅 (SPA)
    location / {
        proxy_pass http://cafe_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Next.js 재시작 시 캐시 무효화
        proxy_cache_bypass $http_cache_control;
    }
}
